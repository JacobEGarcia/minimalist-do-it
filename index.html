<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>do it</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--dim:#a3a39e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fdfdfc;color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
h1{font-size:12px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:36px}
#the-thing{font-family:'Instrument Serif',serif;font-size:clamp(34px,6vw,58px);font-weight:400;text-align:center;line-height:1.2;max-width:700px;min-height:1.2em}
#the-thing:empty::before{content:""}
.row{display:flex;gap:10px;align-items:center;margin-top:40px;flex-wrap:wrap;justify-content:center}
#t{border:none;border-bottom:1px solid #d8d8d2;background:transparent;font-family:'Instrument Serif',serif;font-size:22px;font-style:italic;color:var(--ink);padding:6px 2px;width:min(320px,80vw);outline:none;text-align:center}
#t:focus{border-color:var(--ink)}
#set,#did{cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:10px 18px;border-radius:999px;transition:all .15s}
#set{background:transparent;border:1px solid #d8d8d2;color:var(--dim)}
#set:hover{border-color:var(--ink);color:var(--ink)}
#did{background:var(--ink);border:1px solid var(--ink);color:#fff}
#did:hover{background:#333}
#done-msg{margin-top:26px;font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:var(--ink);min-height:1.4em}
#count{margin-top:8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<h1>do it</h1>
<div id="the-thing"></div>
<div class="row">
<input id="t" placeholder="the one thing" maxlength="70">
<button id="set">set it</button>
<button id="did">did it</button>
</div>
<div id="done-msg"></div>
<div id="count"></div>
<script>
const $=id=>document.getElementById(id);
let thing=localStorage.getItem('doit-thing')||'';
let done=parseInt(localStorage.getItem('doit-done')||'0');
function render(){$('the-thing').textContent=thing;$('count').textContent=done+' things done. nothing else tracked. there is nothing else.';}
$('set').onclick=()=>{const v=$('t').value.trim();if(!v)return;thing=v;$('t').value='';$('done-msg').textContent='';localStorage.setItem('doit-thing',thing);render();};
$('did').onclick=()=>{if(!thing)return;done++;localStorage.setItem('doit-done',done);$('done-msg').textContent='"'+thing+'" - done. set another when ready.';thing='';localStorage.removeItem('doit-thing');render();};
$('t').addEventListener('keydown',e=>{if(e.key==='Enter')$('set').click();});
render();
</script>
</body>
</html>
